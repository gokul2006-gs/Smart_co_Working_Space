<svg width="1400" height="380" viewBox="0 0 1400 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Smart co Working Space animated banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e" />
      <stop offset="45%" stop-color="#0f1a2e" />
      <stop offset="100%" stop-color="#1a0a2e" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="380" rx="24" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="95" x2="1400" y2="95" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="190" x2="1400" y2="190" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="285" x2="1400" y2="285" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="1050" y1="0" x2="1050" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Glowing orbs -->
  <circle cx="180" cy="100" r="130" fill="rgba(245,158,11,0.08)" filter="url(#softglow)">
    <animate attributeName="r" values="110;150;110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1250" cy="280" r="110" fill="rgba(56,189,248,0.08)" filter="url(#softglow)">
    <animate attributeName="r" values="90;130;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="380" r="80" fill="rgba(129,140,248,0.07)" filter="url(#softglow)">
    <animate attributeName="r" values="60;100;60" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Card frame -->
  <rect x="28" y="28" width="1344" height="324" rx="18" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Animated accent line top -->
  <rect x="28" y="28" width="0" height="3" rx="2" fill="url(#brand)">
    <animate attributeName="width" values="0;1344;0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>

  <!-- Left decorative building blocks -->
  <rect x="52" y="260" width="18" height="60" rx="3" fill="rgba(245,158,11,0.5)">
    <animate attributeName="height" values="40;70;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="280;250;280" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="76" y="240" width="18" height="80" rx="3" fill="rgba(249,115,22,0.4)">
    <animate attributeName="height" values="60;90;60" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="260;230;260" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="270" width="18" height="50" rx="3" fill="rgba(239,68,68,0.35)">
    <animate attributeName="height" values="30;60;30" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="290;260;290" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Main heading -->
  <text x="145" y="140" fill="#f8fafc" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="20" letter-spacing="8" font-weight="300" opacity="0.7">SMART CO WORKING SPACE</text>

  <text x="143" y="210" fill="url(#brand)" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1" filter="url(#glow)">
    Book. Work. Grow.
  </text>

  <text x="145" y="252" fill="#94a3b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="22" font-weight="400">
    A full-stack coworking marketplace — discover spaces, manage bookings, accept payments.
  </text>

  <!-- Tech pills -->
  <g transform="translate(145, 276)">
    <!-- React -->
    <rect x="0" y="0" width="80" height="26" rx="13" fill="rgba(97,218,251,0.12)" stroke="rgba(97,218,251,0.3)" stroke-width="1"/>
    <text x="40" y="17" fill="#61dafb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">React 19</text>
    <!-- TanStack -->
    <rect x="88" y="0" width="100" height="26" rx="13" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="138" y="17" fill="#f59e0b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TanStack</text>
    <!-- MongoDB -->
    <rect x="196" y="0" width="96" height="26" rx="13" fill="rgba(71,162,72,0.12)" stroke="rgba(71,162,72,0.3)" stroke-width="1"/>
    <text x="244" y="17" fill="#47a248" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
    <!-- Razorpay -->
    <rect x="300" y="0" width="90" height="26" rx="13" fill="rgba(35,112,237,0.12)" stroke="rgba(35,112,237,0.3)" stroke-width="1"/>
    <text x="345" y="17" fill="#2370ed" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Razorpay</text>
    <!-- TypeScript -->
    <rect x="398" y="0" width="100" height="26" rx="13" fill="rgba(49,120,198,0.12)" stroke="rgba(49,120,198,0.3)" stroke-width="1"/>
    <text x="448" y="17" fill="#3178c6" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TypeScript</text>
    <!-- Tailwind -->
    <rect x="506" y="0" width="90" height="26" rx="13" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="551" y="17" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tailwind 4</text>
  </g>

  <!-- Right side — animated booking card -->
  <rect x="950" y="55" width="400" height="270" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Card header bar -->
  <rect x="950" y="55" width="400" height="48" rx="16" fill="rgba(245,158,11,0.15)"/>
  <rect x="950" y="79" width="400" height="24" fill="rgba(245,158,11,0.15)"/>
  <circle cx="978" cy="79" r="10" fill="rgba(239,68,68,0.7)"/>
  <circle cx="1002" cy="79" r="10" fill="rgba(245,158,11,0.7)"/>
  <circle cx="1026" cy="79" r="10" fill="rgba(34,197,94,0.7)"/>
  <text x="1150" y="85" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" opacity="0.9">Booking Dashboard</text>

  <!-- Card rows -->
  <rect x="970" y="118" width="200" height="12" rx="6" fill="rgba(255,255,255,0.15)">
    <animate attributeName="width" values="160;220;160" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="1190" y="118" width="60" height="12" rx="6" fill="rgba(34,197,94,0.6)"/>

  <rect x="970" y="144" width="170" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1190" y="144" width="70" height="10" rx="5" fill="rgba(245,158,11,0.5)"/>

  <rect x="970" y="168" width="190" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1190" y="168" width="55" height="10" rx="5" fill="rgba(56,189,248,0.5)"/>

  <rect x="970" y="192" width="150" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1190" y="192" width="75" height="10" rx="5" fill="rgba(239,68,68,0.4)"/>

  <!-- Divider -->
  <line x1="970" y1="220" x2="1330" y2="220" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Payment button animation -->
  <rect x="970" y="235" width="160" height="34" rx="17" fill="url(#pill)" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="1050" y="256" fill="#020617" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pay with Razorpay</text>

  <rect x="1148" y="235" width="140" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1218" y="256" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle">View spaces</text>

  <!-- Floating dot indicators -->
  <circle cx="1310" cy="118" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1310" cy="144" r="5" fill="#f59e0b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1310" cy="168" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1310" cy="192" r="5" fill="#ef4444">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom accent line -->
  <rect x="28" y="349" width="0" height="3" rx="2" fill="url(#cool)">
    <animate attributeName="width" values="0;1344;0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" begin="1.5s"/>
  </rect>
</svg>
